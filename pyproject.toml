[project]
name = "turboguard"
version = "0.1.0"
description = "VQ-VAE-based adversarial defense filter for network intrusion detection systems"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "tqdm>=4.66",
    "pyarrow>=14.0",
    "rich>=13.0",
    "shap>=0.43",
    "matplotlib>=3.7",
    "torch>=2.0",
    "torchvision>=0.15",
    "boto3>=1.42.83",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turboguard"]

# ── CUDA PyTorch index ────────────────────────────────────────────────
# uv will pull torch/torchvision from this index (CUDA 12.4).
# Change cu124 to cu118/cu121 to match your driver.

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
